name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm checks

      - name: Typecheck affected
        run: pnpm turbo run typecheck --affected

      - name: Test affected
        run: pnpm turbo run test:coverage --affected

      - name: AI evals
        env:
          DUBSTACK_OPENAI_API_KEY: ${{ secrets.DUBSTACK_OPENAI_API_KEY }}
          DUBSTACK_OPENAI_MODEL: ${{ vars.DUBSTACK_OPENAI_MODEL || 'gpt-5.5' }}
        run: pnpm evals

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: packages/cli/coverage/
          if-no-files-found: ignore
          retention-days: 30
