name: retarget-action CI
on:
  push:
    branches: [main]
    paths:
      - 'packages/retarget-action/**'
      - '.github/workflows/retarget-action-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/retarget-action/**'
      - 'packages/cli/src/lib/pr-body.ts'
      - '.github/workflows/retarget-action-ci.yml'

# Least-privilege GITHUB_TOKEN. This workflow only reads the repo to lint,
# typecheck, test, and verify dist/ freshness — no write APIs needed.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm checks

      - name: Typecheck
        run: pnpm --filter dubstack-retarget-action typecheck

      - name: Test
        run: pnpm --filter dubstack-retarget-action test

      - name: Verify dist/ is up to date with src/
        run: |
          pnpm --filter dubstack-retarget-action build
          if ! git diff --quiet --exit-code -- packages/retarget-action/dist; then
            echo "::error::packages/retarget-action/dist/ is out of sync with src/."
            echo "Run 'pnpm --filter dubstack-retarget-action build' locally and commit the result."
            git --no-pager diff -- packages/retarget-action/dist | head -200
            exit 1
          fi
