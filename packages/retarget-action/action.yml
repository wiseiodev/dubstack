name: Dubstack stack retarget
description: >-
  Retargets dependent stacked PRs when a Dubstack PR merges. Reads the
  hidden `dubstack-metadata` block from PR bodies; no external state.
author: wiseiodev
branding:
  icon: layers
  color: yellow
inputs:
  github-token:
    description: >-
      Token used to read PR bodies and update bases. The default
      ${{ secrets.GITHUB_TOKEN }} works when the workflow has
      `pull-requests: write` permission.
    required: true
outputs:
  status:
    description: >-
      Outcome of the run. One of: done, skipped-not-merged,
      skipped-no-metadata, skipped-legacy-metadata, no-dependents.
  retargeted:
    description: >-
      JSON array of { number, fromBase, toBase } describing each PR
      whose base was actually moved.
  skipped:
    description: >-
      JSON array of { number, reason } describing each dependent PR
      we deliberately left alone (auto-merge in flight, already
      retargeted, metadata refresh only, transient API failure, etc.).
runs:
  using: node24
  main: dist/index.js
