name: Dubstack stack retarget
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
  pull-requests: write
jobs:
  retarget:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: wiseiodev/dubstack-retarget@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
